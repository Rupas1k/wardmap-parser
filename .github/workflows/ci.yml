name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +stable build --target wasm32-unknown-unknown --lib
