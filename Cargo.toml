[package]
name = "d2wm_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "d2wm_parser"

[dependencies]
source2-demo = { git = "https://github.com/Rupas1k/source2-demo", features = ["dota"] }
hashbrown = "0.15"
anyhow = "1.0"
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
