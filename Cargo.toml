[package]
name = "d2wm_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "d2wm_parser"

[dependencies]
source2-demo = "0.5"
hashbrown = "0.17"
anyhow = "1.0"
pyo3 = { version = "0.29", features = ["extension-module"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
