[package]
name = "wardmap-parser"
version = "0.1.0"
edition = "2021"
description = "Shared Dota 2 ward replay parsing and vision metrics"
license = "MIT"
repository = "https://github.com/Rupas1k/wardmap-parser"
publish = false
[features]
default = ["map-2"]
all-maps = ["map-0", "map-1", "map-2"]
map-0 = []
map-1 = []
map-2 = []

[dependencies]
source2-demo = { version = "0.5", default-features = false, features = ["dota"] }
hashbrown = "0.17"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
